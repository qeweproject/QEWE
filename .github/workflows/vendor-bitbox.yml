# TEMPORARY (remove before merge): adds the official BitBox02 library to the lockfile and
# vendors its browser bundle, because the development sandbox has no npm registry access.
name: Vendor BitBox02 client
on:
  push:
    branches: [fonctionnalites-v3.2]
    paths: [.github/workflows/vendor-bitbox.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Inspect the package before installing
        run: npm view @bitboxswiss/bitbox-api name version time.modified maintainers repository.url dist.integrity peerDependencies --json
      - run: npm install --save-dev --save-exact --ignore-scripts @bitboxswiss/bitbox-api
      - run: npm audit signatures
      - run: node node_modules/esbuild/install.js
      - run: node scripts/build-bitbox.cjs
      - name: Pin vendored bytes
        run: |
          node -e "
          const fs=require('fs'),c=require('crypto'),f='VENDOR_SHA256.json',m=JSON.parse(fs.readFileSync(f,'utf8'));
          for(const p of ['app/vendor/bitbox-usb.js','app/vendor/bitbox-usb.js.LEGAL.txt'])if(fs.existsSync(p))m[p]=c.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          fs.writeFileSync(f,JSON.stringify(Object.fromEntries(Object.entries(m).sort()),null,2)+'\n');"
          node scripts/verify-vendor.cjs
          ls -la app/vendor/bitbox-usb.js*; head -c 300 app/vendor/bitbox-usb.js.LEGAL.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json VENDOR_SHA256.json app/vendor/bitbox-usb.js*
          git commit -m "Vendor BitBox02 client: $(node -p "require('@bitboxswiss/bitbox-api/package.json').version")"
          git push
