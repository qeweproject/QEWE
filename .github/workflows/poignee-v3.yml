name: Build private handle V3
on:
  push:
    branches: ['work/poignee-v3']
    paths: ['.github/workflows/poignee-v3.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install geometry tools
        run: python -m pip install --disable-pip-version-check pynacl numpy scipy trimesh manifold3d shapely pillow lxml rtree matplotlib numba networkx
      - name: Create ephemeral encryption key
        id: key
        shell: python
        run: |
          from nacl.public import PrivateKey
          from pathlib import Path
          import os
          sk=PrivateKey.generate()
          p=Path("/tmp/model-secret")
          p.write_bytes(bytes(sk))
          p.chmod(0o600)
          Path("/tmp/model-public.txt").write_text(bytes(sk.public_key).hex())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("pub="+bytes(sk.public_key).hex()+"\n")
      - name: Publish public encryption key
        uses: actions/upload-artifact@v4
        with:
          name: model-key-${{ steps.key.outputs.pub }}
          path: /tmp/model-public.txt
          retention-days: 1
      - name: Build textured handle and validate 3MF
        id: geometry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,sys,time,json,base64,traceback,subprocess,io,zipfile,urllib.request,urllib.error,hashlib
          from pathlib import Path
          from nacl.public import PrivateKey,PublicKey,Box
          secret=PrivateKey(Path("/tmp/model-secret").read_bytes())
          repo=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ["GITHUB_REF_NAME"]
          runid=os.environ["GITHUB_RUN_ID"]
          packet=None
          for attempt in range(240):
              try:
                  req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/.work-3d/input.json?ref="+branch,headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
                  candidate=json.loads(base64.b64decode(data["content"]))
                  if str(candidate.get("run_id"))==runid: packet=candidate;break
              except (urllib.error.HTTPError,urllib.error.URLError,ValueError): pass
              time.sleep(5)
          if packet is None: raise SystemExit("No matching encrypted model input received")
          box=Box(secret,PublicKey(base64.b64decode(packet["public_key"])))
          try:
              config=json.loads(box.decrypt(base64.b64decode(packet["ciphertext"]),base64.b64decode(packet["nonce"])))
              root=Path("/tmp/poignee-v3-job");root.mkdir(mode=0o700,exist_ok=True)
              hashes=["fa2092d1cbe735f448bb9b1611ccc5712b7e78d4fbd3d72c563cec6b704b2ea85e11c71adb50b96eb45990d1c42a3f3ab2cc1194049ded9f2db15d458ed4b707","e486c3d220c2680bf0ddd1ea2bf9e0224b0d958ed5d3a111423ba24779c356c3569f59584559c8bb2aabbe83f0474e93e90d646d279de150e5fb0318c59a93e6","cb27d77499ccc75b18385ea9f2ad6ed7b9f41cacc2d979a9ff43c9e8697bcd4c48661186be533f4f7fdc4274d6d4f411d1c885dd8049dd57dfc512065c033352"]
              for name,expected in zip(["library_file_transfer.py","library_hosted_apps.py","library_upload.py"],hashes):
                  code=config["helpers"][name]
                  if hashlib.sha512(code.encode()).hexdigest()!=expected: raise ValueError("Library helper integrity check failed")
                  (root/name).write_text(code)
              sys.path.insert(0,str(root))
              (root/"client_public").write_bytes(base64.b64decode(packet["public_key"]))
              archives=[]
              for i,transfer in enumerate(config["sources"]):
                  if transfer["file_name"] not in ["poignée.zip","Texture_Grip_RTF6_Fuzzy_04_V3.zip"]: raise ValueError("Unexpected source file")
                  if transfer["size_bytes"]>50000000: raise ValueError("Source exceeds expected limit")
                  dest=root/("source_"+str(i)+".zip")
                  p=subprocess.run([sys.executable,str(root/"library_file_transfer.py"),"materialize",str(dest)],input=json.dumps(transfer),text=True,capture_output=True,timeout=120)
                  if p.returncode: raise RuntimeError("Materialization failed: "+p.stderr[-1500:]+p.stdout[-1500:])
                  archives.append(dest)
              import numpy as np,trimesh
          
              # Dedicated geometry transformation: source units are millimetres.
              import manifold3d as md
              from scipy.ndimage import map_coordinates
              from PIL import Image,ImageDraw,ImageFont
              import shapely
              z0=zipfile.ZipFile(archives[0]);source_name=next(n for n in z0.namelist() if n.lower().endswith(".stl"))
              original=trimesh.load(io.BytesIO(z0.read(source_name)),file_type="stl",force="mesh")
              pieces=original.split(only_watertight=True)
              assert len(pieces)==2
              stem=max(pieces,key=lambda x:x.extents[2])
              united=trimesh.boolean.union(list(pieces),engine="manifold")
              assert united.is_watertight and united.volume>0
              solid=md.Manifold(md.Mesh(vert_properties=np.asarray(united.vertices,dtype=np.float32),tri_verts=np.asarray(united.faces,dtype=np.uint32)))
              refined=solid.refine_to_length(0.16)
              assert refined.num_tri()<6000000, "Detail mesh exceeded size limit"
              raw=refined.to_mesh64()
              parent=np.arange(len(raw.vert_properties),dtype=np.int64)
              parent[np.asarray(raw.merge_from_vert,dtype=np.int64)]=np.asarray(raw.merge_to_vert,dtype=np.int64)
              for _ in range(30):
                  compressed=parent[parent]
                  if np.array_equal(compressed,parent):break
                  parent=compressed
              mesh=trimesh.Trimesh(vertices=np.array(raw.vert_properties[:,:3],dtype=np.float64),faces=parent[np.array(raw.tri_verts,dtype=np.int64)],process=False)
              mesh.remove_unreferenced_vertices()
              assert mesh.is_watertight
              vertices=mesh.vertices.copy()
              normals=mesh.vertex_normals.copy()
              texture_zip=zipfile.ZipFile(archives[1])
              height=np.asarray(Image.open(io.BytesIO(texture_zip.read("RTF6_Fuzzy_04_V3/Heightmap_A_40x80_16bit.png"))),dtype=np.float64)*(0.45/65535.0)
              def sample(u,v):
                  u=1.0-np.abs(np.mod(u,2.0)-1.0)
                  v=1.0-np.abs(np.mod(v,2.0)-1.0)
                  return map_coordinates(height,[v*(height.shape[0]-1),u*(height.shape[1]-1)],order=1,mode="nearest",prefilter=False)
              weights=np.abs(normals)**8
              weights/=np.maximum(weights.sum(axis=1)[:,None],1e-20)
              # Triplanar mapping includes both broad faces and all four edges.
              h=weights[:,2]*sample(vertices[:,1]/40,vertices[:,0]/80)
              h+=weights[:,1]*sample(vertices[:,2]/40,vertices[:,0]/80)
              h+=weights[:,0]*sample(vertices[:,2]/40,vertices[:,1]/80)
              active=np.ones(len(vertices),dtype=float)
              active[vertices[:,2]>6.00001]=0
              section=stem.section(plane_origin=[0,0,6.01],plane_normal=[0,0,1])
              footprint=None
              for line in section.discrete:
                  poly=shapely.Polygon(line[:,:2])
                  if not poly.is_valid: poly=shapely.make_valid(poly)
                  footprint=poly if footprint is None else shapely.symmetric_difference(footprint,poly)
              near=(vertices[:,2]>5.4)&(vertices[:,2]<=6.00001)
              d=shapely.distance(shapely.points(vertices[near,:2]),footprint)
              fade=np.clip(d/0.8,0,1)
              active[near]=fade*fade*(3-2*fade)
              displacement=normals*(h*active)[:,None]
              assert np.max(np.abs(displacement[vertices[:,2]>6.00001]))==0
              mesh.vertices=vertices+displacement
              assert mesh.is_watertight and mesh.is_winding_consistent and mesh.volume>0
              # 180 degrees around X: stem end becomes the bottom contact plane.
              top=float(original.bounds[1,2])
              candidates=[]
              for area,normal,facet in zip(stem.facets_area,stem.facets_normal,stem.facets):
                  centre=stem.triangles_center[facet].mean(axis=0)
                  if normal[2]>0.65 and centre[2]>12:
                      plane=float(np.dot(centre,normal))
                      if np.max(original.vertices@normal)-plane<0.005:candidates.append((float(area),normal.copy()))
              if candidates:
                  contact_area,tipnormal=max(candidates,key=lambda x:x[0])
                  rotation=trimesh.geometry.align_vectors(tipnormal,[0,0,-1])
                  mesh.apply_transform(rotation)
                  mesh.apply_translation([0,0,-mesh.bounds[0,2]])
              else:
                  contact_area=0.0
                  mesh.vertices=np.column_stack((mesh.vertices[:,0],original.bounds[1,1]-mesh.vertices[:,1],top-mesh.vertices[:,2]))
              assert abs(mesh.bounds[0,2])<0.0001
              offset=np.array([30-mesh.bounds[0,0],30-mesh.bounds[0,1],0])
              mesh.apply_translation(offset)
              file3mf=root/"Poignee_V3_FlashStudio_tige_plateau.3mf"
              file3mf.write_bytes(trimesh.exchange.threemf.export_3MF(mesh))
              check=trimesh.load(file3mf,force="mesh",process=False)
              assert check.is_watertight and check.is_winding_consistent
              assert np.allclose(mesh.bounds,check.bounds,atol=0.0002)
              assert abs(check.volume-mesh.volume)/mesh.volume<0.00001
              from numba import njit
              @njit
              def raster(v,f,az,el,width,height):
                  az=np.deg2rad(az);el=np.deg2rad(el)
                  R=np.array([[np.cos(az),-np.sin(az),0.0],[-np.sin(el)*np.sin(az),-np.sin(el)*np.cos(az),np.cos(el)],[np.cos(el)*np.sin(az),np.cos(el)*np.cos(az),np.sin(el)]])
                  p=v@R.T
                  minx=p[:,0].min();maxx=p[:,0].max();miny=p[:,1].min();maxy=p[:,1].max()
                  scale=min((width-45)/(maxx-minx),(height-45)/(maxy-miny))
                  p[:,0]=(p[:,0]-(minx+maxx)/2)*scale+width/2
                  p[:,1]=height/2-(p[:,1]-(miny+maxy)/2)*scale
                  depth=np.full((height,width),-1e20)
                  img=np.full((height,width,3),245,dtype=np.uint8)
                  for ids in f:
                      a=p[ids[0]];b=p[ids[1]];c=p[ids[2]]
                      det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1])
                      if abs(det)<1e-12:continue
                      xlo=max(0,int(np.floor(min(a[0],b[0],c[0]))));xhi=min(width-1,int(np.ceil(max(a[0],b[0],c[0]))))
                      ylo=max(0,int(np.floor(min(a[1],b[1],c[1]))));yhi=min(height-1,int(np.ceil(max(a[1],b[1],c[1]))))
                      e1=b-a;e2=c-a;no=np.cross(e1,e2);length=np.sqrt((no*no).sum())
                      shade=0.32+0.68*abs((no[0]*0.25+no[1]*-0.45+no[2]*0.857)/max(length,1e-12))
                      for yy in range(ylo,yhi+1):
                          for xx in range(xlo,xhi+1):
                              wa=((b[1]-c[1])*(xx+0.5-c[0])+(c[0]-b[0])*(yy+0.5-c[1]))/det
                              wb=((c[1]-a[1])*(xx+0.5-c[0])+(a[0]-c[0])*(yy+0.5-c[1]))/det
                              wc=1-wa-wb
                              if wa>=-1e-7 and wb>=-1e-7 and wc>=-1e-7:
                                  zz=wa*a[2]+wb*b[2]+wc*c[2]
                                  if zz>depth[yy,xx]:
                                      depth[yy,xx]=zz;img[yy,xx,0]=int(125*shade);img[yy,xx,1]=int(174*shade);img[yy,xx,2]=int(205*shade)
                  return img
              v=np.ascontiguousarray(mesh.vertices);f=np.ascontiguousarray(mesh.faces)
              img1=Image.fromarray(raster(v,f,25,25,1300,700)).resize((650,350),Image.Resampling.LANCZOS)
              img2=Image.fromarray(raster(v,f,-25,-30,1300,700)).resize((650,350),Image.Resampling.LANCZOS)
              preview=Image.new("RGB",(1300,460),(245,245,245));preview.paste(img1,(0,75));preview.paste(img2,(650,75))
              draw=ImageDraw.Draw(preview);font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",23);small=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",17)
              draw.text((25,18),"Poignee V3 - relief integre, tige lisse",fill=(25,45,55),font=font)
              draw.text((25,55),"Orientation pour impression",fill=(35,55,65),font=small)
              draw.text((675,55),"Vue du dessous : tige et raccord",fill=(35,55,65),font=small)
              draw.text((25,430),"V3 A : plots 0,45 mm + fond rugueux 0,20 mm. Tige sur le plateau.",fill=(35,55,65),font=small)
              previewpath=root/"Apercu_Poignee_V3.png";preview.save(previewpath)
              summary={"watertight":bool(mesh.is_watertight),"winding_consistent":bool(mesh.is_winding_consistent),"faces":len(mesh.faces),"vertices":len(mesh.vertices),"dimensions_mm":mesh.extents.tolist(),"volume_mm3":float(mesh.volume),"bottom_z_mm":float(mesh.bounds[0,2]),"stem_displacement_mm":0.0,"stem_contact_flat_area_mm2":contact_area,"max_relief_mm":float((h*active).max()),"roundtrip_3mf":True}
              (root/"geometry_summary.json").write_text(json.dumps(summary))
              from library_upload import UploadRequest
              requests=[{"local_path":str(file3mf),"purpose":"create_library_file","library_artifact_type":"other"},{"local_path":str(previewpath),"purpose":"create_library_file","library_artifact_type":"image"}]
              (root/"save_request.json").write_text(json.dumps({"uploads":requests}))
              with open(os.environ["GITHUB_OUTPUT"],"a") as gout:gout.write("sizes="+str(file3mf.stat().st_size)+"-"+str(previewpath.stat().st_size)+"\n")
              (root/"geometry_ready.txt").write_text("Outputs generated; files remain private")
              answer={"ok":True,"summary":summary}
          
          except BaseException: answer={"ok":False,"error":traceback.format_exc()}
          print("MODEL_RESULT="+base64.b64encode(bytes(box.encrypt(json.dumps(answer).encode()))).decode(),flush=True)
          if not answer["ok"]: raise SystemExit(1)
          
      - name: Publish output readiness marker
        uses: actions/upload-artifact@v4
        with:
          name: geometry-ready-${{ steps.geometry.outputs.sizes }}
          path: /tmp/poignee-v3-job/geometry_ready.txt
          retention-days: 1
      - name: Install official transfer utility if needed
        shell: python
        run: |
          import os,shutil,tarfile,urllib.request,io
          from pathlib import Path
          if not shutil.which("azcopy"):
              raw=urllib.request.urlopen("https://aka.ms/downloadazcopy-v10-linux",timeout=90).read()
              archive=tarfile.open(fileobj=io.BytesIO(raw),mode="r:gz")
              entry=next(x for x in archive.getmembers() if x.name.endswith("/azcopy") and x.isfile())
              directory=Path("/tmp/poignee-tools");directory.mkdir(mode=0o700,exist_ok=True)
              output=directory/"azcopy";output.write_bytes(archive.extractfile(entry).read());output.chmod(0o700)
              with open(os.environ["GITHUB_PATH"],"a") as f:f.write(str(directory)+"\n")
      - name: Start private file save helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import subprocess,sys,time
          root=Path("/tmp/poignee-v3-job")
          (root/"save_bridge.py").write_text("import os,sys,json,time,base64,traceback,urllib.request,urllib.error\nfrom pathlib import Path\nfrom nacl.public import PrivateKey,PublicKey,Box\nroot=Path(\"/tmp/poignee-v3-job\")\nsys.path.insert(0,str(root))\nfrom library_upload import LibraryUploadWorkflow,SignedUrlUploader\nfrom library_file_transfer import LibraryFileMaterializer\nsecret=PrivateKey(Path(\"/tmp/model-secret\").read_bytes())\nbox=Box(secret,PublicKey((root/\"client_public\").read_bytes()))\nrepo=os.environ[\"GITHUB_REPOSITORY\"];branch=os.environ[\"GITHUB_REF_NAME\"];runid=os.environ[\"GITHUB_RUN_ID\"]\nclass PrivateBridge:\n    def call_tool(self,connector,operation,arguments):\n        if connector!=\"connector_openai_library\" or operation not in (\"prepare_uploads\",\"finalize_uploads\"):raise ValueError(\"Unsupported save operation\")\n        encrypted=base64.b64encode(bytes(box.encrypt(json.dumps({\"operation\":operation,\"arguments\":arguments}).encode()))).decode()\n        (root/(\"request-\"+operation+\".json\")).write_text(json.dumps({\"ciphertext\":encrypted}))\n        for attempt in range(240):\n            try:\n                path=\".work-3d/reply-\"+operation+\".json\"\n                req=urllib.request.Request(\"https://api.github.com/repos/\"+repo+\"/contents/\"+path+\"?ref=\"+branch,headers={\"Authorization\":\"Bearer \"+os.environ[\"GITHUB_TOKEN\"],\"Accept\":\"application/vnd.github+json\",\"Cache-Control\":\"no-cache\"})\n                with urllib.request.urlopen(req,timeout=20) as response:data=json.load(response)\n                packet=json.loads(base64.b64decode(data[\"content\"]))\n                if str(packet.get(\"run_id\"))==runid:\n                    response=json.loads(box.decrypt(base64.b64decode(packet[\"ciphertext\"]),base64.b64decode(packet[\"nonce\"])))\n                    if response[\"operation\"]!=operation:raise ValueError(\"Mismatched reply\")\n                    return response[\"response\"]\n            except (urllib.error.HTTPError,urllib.error.URLError,ValueError):pass\n            time.sleep(5)\n        raise TimeoutError(\"Save response not received\")\ntry:\n    response=LibraryUploadWorkflow(apps_client=PrivateBridge(),materializer=LibraryFileMaterializer(),uploader=SignedUrlUploader()).run(json.loads((root/\"save_request.json\").read_text()))\n    result={\"ok\":True,\"result\":response}\nexcept BaseException:result={\"ok\":False,\"error\":traceback.format_exc()}\n(root/\"save_result\").write_text(base64.b64encode(bytes(box.encrypt(json.dumps(result).encode()))).decode())\n(root/\"save_done\").write_text(\"done\")\n")
          log=open(root/"save_private.log","w")
          subprocess.Popen([sys.executable,str(root/"save_bridge.py")],stdout=log,stderr=log)
          for i in range(120):
              if (root/"request-prepare_uploads.json").exists():break
              if (root/"save_done").exists():raise RuntimeError("Save helper stopped before preparation")
              time.sleep(1)
          else:raise TimeoutError("Save helper did not start")
          
      - name: Publish encrypted save preparation request
        uses: actions/upload-artifact@v4
        with:
          name: save-prepare-${{ steps.geometry.outputs.sizes }}
          path: /tmp/poignee-v3-job/request-prepare_uploads.json
          retention-days: 1
      - name: Wait for verified byte transfer
        shell: python
        run: |
          from pathlib import Path
          import time
          root=Path("/tmp/poignee-v3-job")
          for i in range(1500):
              if (root/"request-finalize_uploads.json").exists():break
              if (root/"save_done").exists():
                  print("SAVE_RESULT="+(root/"save_result").read_text(),flush=True)
                  raise RuntimeError("Save helper stopped before finalization")
              time.sleep(1)
          else:raise TimeoutError("Transfer did not complete")
          
      - name: Publish encrypted save finalization request
        uses: actions/upload-artifact@v4
        with:
          name: model-finalize-ready
          path: /tmp/poignee-v3-job/request-finalize_uploads.json
          retention-days: 1
      - name: Finish saving private files
        shell: python
        run: |
          from pathlib import Path
          import time
          root=Path("/tmp/poignee-v3-job")
          for i in range(1500):
              if (root/"save_done").exists():
                  print("SAVE_RESULT="+(root/"save_result").read_text(),flush=True)
                  break
              time.sleep(1)
          else:raise TimeoutError("Saving did not finish")
          
