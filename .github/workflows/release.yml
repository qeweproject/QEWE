name: Reviewed installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact version tag to publish after all checks; leave empty for builds only'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            command: npm run build
            extension: exe
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            command: npm run build:linux
            extension: deb
          - os: macos-latest
            platform: mac
            arch: arm64
            command: npm exec -- electron-builder --mac dmg --arm64 --publish never
            extension: dmg
          - os: macos-latest
            platform: mac
            arch: x64
            command: npm exec -- electron-builder --mac dmg --x64 --publish never
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - run: npm run build:vendor
      - run: npm run verify:vendor
      - run: git diff --exit-code -- app/vendor
      - run: npm run verify:privacy
      - run: npm test
      - run: npm run test:dom
      - run: ${{ matrix.command }}
      - run: node scripts/verify-release.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Collect verified installer
        shell: bash
        run: |
          mkdir -p release-files
          cp ../deliverables/QEWE_*.${{ matrix.extension }} release-files/
          cp ../deliverables/QEWE_*.${{ matrix.extension }}.sha256 release-files/
          node scripts/source-manifest.cjs > release-files/SOURCE_SHA256.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qewe-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-files/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    if: ${{ !github.event.repository.private && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qewe-*
          path: downloaded-installers
      - name: Dependency inventory and release manifest
        run: |
          mkdir -p release-files
          npm sbom --package-lock-only --sbom-format=cyclonedx > release-files/SBOM.cdx.json
          node scripts/prepare-public-release.cjs
      - name: Attest the verified files
        id: provenance
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: release-files/*
      - name: Verify provenance before distribution
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" release-files/provenance.sigstore.json
          for file in release-files/*.exe release-files/*.deb release-files/*.dmg; do
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --deny-self-hosted-runners
          done
      - name: Publish a complete experimental preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual publication creates the exact checked commit's tag only after
          # native payload and provenance checks. Never move an existing tag.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > release-tag.json; then
              jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' release-tag.json
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          gh release create "$RELEASE_TAG" release-files/* --verify-tag --draft --prerelease --title "QEWE ${RELEASE_TAG#v} · public preview" --notes-file RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
