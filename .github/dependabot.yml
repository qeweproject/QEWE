version: 2
updates:
  # Wallet software: never adopt a release the day it is published. Most npm
  # supply-chain compromises are detected and pulled within days, so wait first.
  # Every update PR must still be reviewed (lockfile diff, vendor rebuild, tests).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      build-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
