name: Bug report
description: Report a reproducible problem using public test fixtures only.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not post seeds, private keys, RPC credentials, personal wallet exports or signed transactions. Report security issues privately through the Security tab."
  - type: input
    id: version
    attributes:
      label: QEWE version and operating system/architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps using public test data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Public error message (remove personal data)
